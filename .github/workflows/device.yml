name: Device protocol and UART tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sh -n scripts/board-preflight.sh && sh scripts/board-preflight.sh --help
      - run: sudo apt-get update
      - run: sudo apt-get install -y cmake g++ libprotobuf-dev protobuf-compiler
      - run: cmake -S . -B build -DLIDAR_WITH_XTSDK=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --output-log build/ctest-results.txt
      - run: cmake -S . -B build/eff-only -DBUILD_OBS=OFF -DBUILD_TESTING=OFF
      - run: cmake --build build/eff-only --target mfs_eff --parallel 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-validation
          path: |
            build/ctest-results.txt
  arm-eff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: protocolbuffers/protobuf
          ref: f0dc78d7e6e331b8c6bb2d5283e06aa26883ca7c
          path: protobuf-src
      - run: sudo apt-get update && sudo apt-get install -y g++-arm-linux-gnueabihf protobuf-compiler
      - name: Build ARM32 Protobuf (host protoc remains native)
        run: |
          cmake -S protobuf-src/cmake -B build/protobuf-arm \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/arm-deps" \
            -Dprotobuf_BUILD_TESTS=OFF -Dprotobuf_BUILD_PROTOC_BINARIES=OFF -Dprotobuf_BUILD_SHARED_LIBS=OFF
          cmake --build build/protobuf-arm --parallel 2
          cmake --install build/protobuf-arm
      - name: Link full EFF for Ubuntu ARMHF (not the PetaLinux sysroot)
        run: |
          cmake -S . -B build/arm-eff -DBUILD_OBS=OFF -DBUILD_TESTING=OFF \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_PREFIX_PATH="$PWD/build/arm-deps" -DProtobuf_USE_STATIC_LIBS=ON \
            -DProtobuf_PROTOC_EXECUTABLE=/usr/bin/protoc
          cmake --build build/arm-eff --parallel 2
          file build/arm-eff/mfs_eff
          arm-linux-gnueabihf-readelf -h build/arm-eff/mfs_eff

      - run: arm-linux-gnueabihf-g++ -std=c++17 -D_DEFAULT_SOURCE -c motor/motor.cpp -o motor-arm.o
      - run: file motor-arm.o
