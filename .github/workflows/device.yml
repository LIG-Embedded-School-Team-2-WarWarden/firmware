name: Device protocol and UART tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: LIG-Embedded-School-Team-2-WarWarden/ai-generated-c2
          ref: f5981e1319a523926666d60fb7c283c71f828be0
          submodules: recursive
          path: c2-host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update
      - run: sudo apt-get install -y cmake g++ libprotobuf-dev protobuf-compiler
      - run: python -m pip install -r c2-host/requirements-team.txt
      - run: cmake -S . -B build -DLIDAR_WITH_XTSDK=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --output-log build/ctest-results.txt
      - run: cmake -S c2-host -B c2-host/build -DC2_BUILD_LIVE=OFF
      - run: cmake --build c2-host/build --parallel 2
      - run: ctest --test-dir c2-host/build --output-on-failure
      - run: python tests/test_c2_link.py --obs build/mfs_obs --eff build/mfs_eff --c2-root c2-host --detector c2-host/build/c2_detector_worker 2>&1 | tee build/integration-results.txt
      - run: cmake -S . -B build/eff-only -DBUILD_OBS=OFF -DBUILD_TESTING=OFF
      - run: cmake --build build/eff-only --target mfs_eff --parallel 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-validation
          path: |
            build/ctest-results.txt
            build/integration-results.txt
  arm-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y g++-arm-linux-gnueabihf
      - run: arm-linux-gnueabihf-g++ -std=c++17 -D_DEFAULT_SOURCE -c motor/motor.cpp -o motor-arm.o
      - run: file motor-arm.o
